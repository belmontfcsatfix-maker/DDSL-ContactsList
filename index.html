<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>League Contacts</title>
<style>
  :root{
    --green-900:#12332a;
    --green-800:#1b4a3a;
    --green-700:#25674f;
    --gold-500:#c8952e;
    --gold-400:#dcae52;
    --paper:#f5f6f3;
    --card:#ffffff;
    --line:#e2e5df;
    --ink:#182420;
    --ink-soft:#5c6a63;
    --danger:#a13d3d;
    --radius:10px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#121712;
      --card:#1a211b;
      --line:#2b332c;
      --ink:#eef1ec;
      --ink-soft:#9aa79e;
      --green-900:#0d241d;
      --green-800:#173d2f;
    }
  }
  :root[data-theme="dark"]{
    --paper:#121712;
    --card:#1a211b;
    --line:#2b332c;
    --ink:#eef1ec;
    --ink-soft:#9aa79e;
  }

  header.top{
    background:linear-gradient(160deg,var(--green-900),var(--green-800));
    color:#f2f5f0;
    padding:22px 20px 0;
    position:sticky;
    top:0;
    z-index:20;
    padding-top:calc(22px + env(safe-area-inset-top,0px));
  }
  .top-inner{max-width:1040px;margin:0 auto;}
  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .brand h1{
    margin:0;
    font-size:1.5rem;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .brand .sub{
    color:#c7d3c9;
    font-size:0.85rem;
    margin-top:2px;
  }
  .count-pill{
    font-size:0.78rem;
    color:var(--gold-400);
    border:1px solid rgba(220,174,82,0.4);
    padding:4px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  nav.tabs{
    display:flex;
    gap:4px;
    margin-top:18px;
  }
  nav.tabs button{
    flex:1;
    background:transparent;
    border:none;
    color:#c7d3c9;
    font-size:0.95rem;
    font-weight:600;
    padding:12px 8px 14px;
    cursor:pointer;
    border-bottom:3px solid transparent;
    transition:color .15s ease, border-color .15s ease;
    font-family:inherit;
  }
  nav.tabs button.active{
    color:#ffffff;
    border-bottom-color:var(--gold-400);
  }
  nav.tabs button:hover{color:#ffffff;}

  main{
    max-width:1040px;
    margin:0 auto;
    padding:18px 20px 60px;
  }

  .toolbar{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:16px;
  }
  .search-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .search-box{
    position:relative;
    flex:1 1 260px;
  }
  .search-box input{
    width:100%;
    padding:11px 14px 11px 38px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    font-size:0.95rem;
    font-family:inherit;
  }
  .search-box input:focus{
    outline:2px solid var(--green-700);
    outline-offset:1px;
  }
  .search-box svg{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    color:var(--ink-soft);
    pointer-events:none;
  }
  select{
    padding:11px 12px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    font-size:0.9rem;
    font-family:inherit;
    min-width:150px;
  }
  select:focus{outline:2px solid var(--green-700);outline-offset:1px;}

  .chip-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .chip{
    padding:7px 13px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    font-size:0.82rem;
    cursor:pointer;
    font-family:inherit;
    transition:all .12s ease;
  }
  .chip.active{
    background:var(--green-800);
    border-color:var(--green-800);
    color:#fff;
  }
  .chip:hover:not(.active){border-color:var(--green-700);color:var(--ink);}

  .result-meta{
    font-size:0.82rem;
    color:var(--ink-soft);
    margin:2px 2px 10px;
  }

  /* Club cards */
  .club-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
  }
  .club-head{
    padding:13px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    gap:10px;
  }
  .club-head:hover{background:rgba(37,103,79,0.05);}
  .club-name{
    font-weight:700;
    font-size:1rem;
    letter-spacing:-0.005em;
  }
  .club-head .badges{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    margin-top:4px;
  }
  .role-badge{
    font-size:0.68rem;
    color:var(--green-700);
    background:rgba(37,103,79,0.1);
    padding:2px 7px;
    border-radius:5px;
    white-space:nowrap;
  }
  :root[data-theme="dark"] .role-badge, @media (prefers-color-scheme:dark){.role-badge{color:#8fd6b3;background:rgba(143,214,179,0.12);}}
  .chevron{
    width:18px;height:18px;color:var(--ink-soft);
    transition:transform .15s ease;
    flex-shrink:0;
  }
  .club-card.open .chevron{transform:rotate(180deg);}
  .club-body{
    display:none;
    border-top:1px solid var(--line);
  }
  .club-card.open .club-body{display:block;}
  .contact-row{
    padding:12px 16px;
    display:grid;
    grid-template-columns:1fr;
    gap:6px;
    border-bottom:1px solid var(--line);
  }
  .contact-row:last-child{border-bottom:none;}
  .contact-role{
    font-size:0.72rem;
    font-weight:700;
    color:var(--gold-500);
    text-transform:none;
  }
  .contact-name{font-weight:600;font-size:0.95rem;}
  .contact-links{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-top:2px;
  }
  .contact-links button{
    color:var(--green-700);
    text-decoration:none;
    font-size:0.87rem;
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    font-family:inherit;
  }
  :root[data-theme="dark"] .contact-links button, @media (prefers-color-scheme:dark){.contact-links button{color:#8fd6b3;}}
  .contact-links button:hover{text-decoration:underline;}
  .contact-links svg{width:14px;height:14px;flex-shrink:0;}
  .no-info{color:var(--ink-soft);font-size:0.85rem;font-style:italic;}

  /* Referee table */
  .ref-list{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .ref-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    gap:12px;
  }
  .ref-row:last-child{border-bottom:none;}
  .ref-name{font-weight:600;font-size:0.95rem;}
  .ref-name .initial-dot{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:28px;height:28px;
    border-radius:50%;
    background:var(--green-800);
    color:#dcae52;
    font-size:0.72rem;
    font-weight:700;
    margin-right:10px;
    vertical-align:middle;
  }
  .ref-row button.call-link{
    color:var(--green-700);
    text-decoration:none;
    font-size:0.87rem;
    white-space:nowrap;
    display:inline-flex;
    align-items:center;
    gap:5px;
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:999px;
    background:var(--card);
    cursor:pointer;
    font-family:inherit;
  }
  :root[data-theme="dark"] .ref-row button.call-link, @media (prefers-color-scheme:dark){.ref-row button.call-link{color:#8fd6b3;}}
  .ref-row button.call-link:hover{border-color:var(--green-700);}
  .ref-row button.call-link svg{width:13px;height:13px;}

  /* Confirm modal */
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(10,16,12,0.55);
    z-index:100;
    align-items:flex-end;
    justify-content:center;
    padding:0;
  }
  .modal-overlay.open{display:flex;}
  .modal-card{
    background:var(--card);
    width:100%;
    max-width:420px;
    border-radius:16px 16px 0 0;
    padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -8px 30px rgba(0,0,0,0.25);
  }
  @media (min-width:520px){
    .modal-overlay{align-items:center;}
    .modal-card{border-radius:16px;}
  }
  .modal-icon{
    width:44px;height:44px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:14px;
  }
  .modal-icon.whatsapp{background:rgba(37,211,102,0.14);color:#25d366;}
  .modal-icon.email{background:rgba(37,103,79,0.12);color:var(--green-700);}
  .modal-icon svg{width:22px;height:22px;}
  .modal-title{font-size:1.05rem;font-weight:700;margin:0 0 4px;}
  .modal-sub{color:var(--ink-soft);font-size:0.87rem;margin:0 0 20px;word-break:break-word;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions button{
    flex:1;
    padding:12px 14px;
    border-radius:10px;
    font-size:0.92rem;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
  }
  .modal-actions button.primary{
    background:var(--green-800);
    border-color:var(--green-800);
    color:#fff;
  }
  .modal-actions button.primary.whatsapp-btn{
    background:#25d366;
    border-color:#25d366;
    color:#0a2a17;
  }
  .modal-actions button:hover{filter:brightness(1.05);}

  .letter-jump{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    margin-bottom:12px;
  }
  .letter-jump button{
    width:26px;height:26px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    font-size:0.75rem;
    cursor:pointer;
    font-family:inherit;
  }
  .letter-jump button.has-data{color:var(--ink);}
  .letter-jump button:hover.has-data{background:var(--green-800);color:#fff;border-color:var(--green-800);}
  .letter-jump button:disabled{opacity:0.35;cursor:default;}

  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
  }
  .empty-state svg{width:40px;height:40px;margin-bottom:10px;opacity:0.5;}

  .clear-btn{
    background:none;border:none;color:var(--ink-soft);
    font-size:0.82rem;cursor:pointer;text-decoration:underline;
    font-family:inherit;padding:4px;
  }

  footer.note{
    max-width:1040px;margin:0 auto;padding:0 20px 40px;
    color:var(--ink-soft);font-size:0.78rem;
  }

  ::selection{background:var(--gold-400);color:#12332a;}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div>
        <h1>League Contacts</h1>
        <div class="sub">Club secretaries &amp; match officials, September 2026</div>
      </div>
      <div class="count-pill" id="countPill">— entries</div>
    </div>
    <nav class="tabs">
      <button class="active" data-tab="clubs" id="tabBtnClubs">Club Secretaries</button>
      <button data-tab="refs" id="tabBtnRefs">Referees</button>
    </nav>
  </div>
</header>

<main>

  <!-- CLUBS TAB -->
  <section id="panel-clubs">
    <div class="toolbar">
      <div class="search-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="clubSearch" placeholder="Search club, secretary name, phone or email…" autocomplete="off">
        </div>
        <select id="clubSelect">
          <option value="">All clubs</option>
        </select>
      </div>
      <div class="chip-row" id="roleChips"></div>
    </div>
    <div class="result-meta" id="clubResultMeta"></div>
    <div id="clubResults"></div>
  </section>

  <!-- REFEREES TAB -->
  <section id="panel-refs" style="display:none;">
    <div class="toolbar">
      <div class="search-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="refSearch" placeholder="Search referee name or mobile number…" autocomplete="off">
        </div>
      </div>
      <div class="letter-jump" id="letterJump"></div>
    </div>
    <div class="result-meta" id="refResultMeta"></div>
    <div class="ref-list" id="refResults"></div>
  </section>

</main>

<footer class="note">Tap a club to expand its contacts. Tap a phone number to message on WhatsApp, or an email to send via Gmail.</footer>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) closeModal()">
  <div class="modal-card">
    <div class="modal-icon" id="modalIcon"></div>
    <p class="modal-title" id="modalTitle"></p>
    <p class="modal-sub" id="modalSub"></p>
    <div class="modal-actions">
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" id="modalConfirmBtn"></button>
    </div>
  </div>
</div>

  if(digits.startsWith('0')) return '353' + digits.slice(1);
  return digits;
}

  document.getElementById('modalIcon').className = 'modal-icon whatsapp';
  document.getElementById('modalIcon').innerHTML = iconWhatsapp;
  document.getElementById('modalTitle').textContent = `Message ${name} on WhatsApp?`;
  document.getElementById('modalSub').textContent = phone;
  const btn = document.getElementById('modalConfirmBtn');
  btn.textContent = 'Open WhatsApp';
  btn.className = 'primary whatsapp-btn';
  pendingAction = () => window.open('https://wa.me/' + digits, '_blank');
  document.getElementById('modalOverlay').classList.add('open');
}
function offerEmail(name, email){
  document.getElementById('modalIcon').className = 'modal-icon email';
  document.getElementById('modalIcon').innerHTML = iconMail;
  document.getElementById('modalTitle').textContent = `Email ${name}?`;
  document.getElementById('modalSub').textContent = email;
  const btn = document.getElementById('modalConfirmBtn');
  btn.textContent = 'Open Gmail';
  btn.className = 'primary';
  pendingAction = () => window.open('https://mail.google.com/mail/?view=cm&fs=1&tf=1&to=' + encodeURIComponent(email), '_blank');
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  pendingAction = null;
}
document.getElementById('modalConfirmBtn').addEventListener('click', ()=>{
  if(pendingAction) pendingAction();
  closeModal();
});

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- CLUBS ---------- */
let activeRoles = new Set();

function populateClubSelect(){
  const sel = document.getElementById('clubSelect');
  const names = CLUBS.map(c => c.club).sort((a,b)=>a.localeCompare(b));
  names.forEach(n=>{
    const o = document.createElement('option');
    o.value = n; o.textContent = n;
    sel.appendChild(o);
  });
}

function populateRoleChips(){
  const wrap = document.getElementById('roleChips');
  ROLES.forEach(r=>{
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = ROLE_SHORT[r];
    b.dataset.role = r;
    b.onclick = ()=>{
      if(activeRoles.has(r)){ activeRoles.delete(r); b.classList.remove('active'); }
      else { activeRoles.add(r); b.classList.add('active'); }
      renderClubs();
    };
    wrap.appendChild(b);
  });
}

function clubMatches(club, query, selectedClub, roles){
  if(selectedClub && club.club !== selectedClub) return false;
  if(roles.size > 0){
    const hasRole = club.contacts.some(c => roles.has(c.role));
    if(!hasRole) return false;
  }
  if(!query) return true;
  const q = query.toLowerCase();
  if(club.club.toLowerCase().includes(q)) return true;
  return club.contacts.some(c =>
    (c.name && c.name.toLowerCase().includes(q)) ||
    (c.phone && c.phone.toLowerCase().includes(q)) ||
    (c.email && c.email.toLowerCase().includes(q))
  );
}

function renderClubs(){
  const query = document.getElementById('clubSearch').value.trim();
  const selectedClub = document.getElementById('clubSelect').value;
  const results = CLUBS.filter(c => clubMatches(c, query, selectedClub, activeRoles))
                        .sort((a,b)=>a.club.localeCompare(b.club));

  const container = document.getElementById('clubResults');
  const meta = document.getElementById('clubResultMeta');
  meta.textContent = results.length === CLUBS.length
    ? `${results.length} clubs`
    : `${results.length} of ${CLUBS.length} clubs`;

  if(results.length === 0){
    container.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <div>No clubs match your search.</div>
      <button class="clear-btn" onclick="clearClubFilters()">Clear filters</button>
    </div>`;
    return;
  }

  container.innerHTML = results.map((club, i) => {
    const filteredContacts = activeRoles.size > 0
      ? club.contacts.filter(c => activeRoles.has(c.role))
      : club.contacts;
    const badges = club.contacts.map(c => `<span class="role-badge">${ROLE_SHORT[c.role]}</span>`).join('');
    const rows = filteredContacts.length ? filteredContacts.map(c => `
        <div class="contact-row">
          <div class="contact-role">${ROLE_SHORT[c.role]}</div>
          <div class="contact-name">${escapeHtml(c.name || '—')}</div>
          <div class="contact-links">
            ${c.phone ? `<button onclick="offerWhatsApp('${escapeHtml((c.name||'this contact')).replace(/'/g,"\\'")}','${escapeHtml(c.phone).replace(/'/g,"\\'")}')">${iconPhone} ${escapeHtml(c.phone)}</button>` : ''}
            ${c.email ? `<button onclick="offerEmail('${escapeHtml((c.name||'this contact')).replace(/'/g,"\\'")}','${escapeHtml(c.email).replace(/'/g,"\\'")}')">${iconMail} ${escapeHtml(c.email)}</button>` : ''}
          </div>
        </div>`).join('') : `<div class="contact-row"><span class="no-info">No contact matches the selected role filter.</span></div>`;

    return `<div class="club-card" id="club-${i}">
      <div class="club-head" onclick="toggleClub(${i})">
        <div>
          <div class="club-name">${escapeHtml(club.club)}</div>
          <div class="badges">${badges}</div>
        </div>
        ${iconChevron}
      </div>
      <div class="club-body">${rows}</div>
    </div>`;
  }).join('');

  // auto-open if a single result or a search is active
  if(results.length <= 3 && (query || selectedClub)){
    results.forEach((c,i)=>{
      const el = document.getElementById('club-'+i);
      if(el) el.classList.add('open');
    });
  }
}

function toggleClub(i){
  document.getElementById('club-'+i).classList.toggle('open');
}
function clearClubFilters(){
  document.getElementById('clubSearch').value = '';
  document.getElementById('clubSelect').value = '';
  activeRoles.clear();
  document.querySelectorAll('#roleChips .chip').forEach(b=>b.classList.remove('active'));
  renderClubs();
}

/* ---------- REFEREES ---------- */
function refFullName(r){
  return (r.firstName + ' ' + r.lastName).trim();
}
function refInitial(r){
  return (r.firstName || r.lastName || '?').charAt(0).toUpperCase();
}
function formatMobile(m){
  if(!m) return null;
  // 353XXXXXXXXX -> +353 XX XXX XXXX (best-effort display)
  const s = String(m);
  if(s.startsWith('353') && s.length >= 11){
    return '+353 ' + s.slice(3,5) + ' ' + s.slice(5,8) + ' ' + s.slice(8);
  }
  return s;
}

let letterFilter = null;

function populateLetterJump(){
  const wrap = document.getElementById('letterJump');
  const present = new Set(REFEREES.map(r => (r.firstName||r.lastName||'?').charAt(0).toUpperCase()));
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  wrap.innerHTML = alphabet.map(letter => {
    const has = present.has(letter);
    return `<button class="${has ? 'has-data' : ''}" ${has ? '' : 'disabled'} onclick="jumpToLetter('${letter}')" id="letter-${letter}">${letter}</button>`;
  }).join('');
}
function jumpToLetter(letter){
  letterFilter = (letterFilter === letter) ? null : letter;
  document.querySelectorAll('#letterJump button').forEach(b=>b.classList.remove('active'));
  if(letterFilter){
    const btn = document.getElementById('letter-'+letterFilter);
    if(btn) btn.classList.add('active');
  }
  renderRefs();
}

function renderRefs(){
  const query = document.getElementById('refSearch').value.trim().toLowerCase();
  let results = REFEREES.filter(r=>{
    if(letterFilter && (r.firstName||r.lastName||'').charAt(0).toUpperCase() !== letterFilter) return false;
    if(!query) return true;
    const full = refFullName(r).toLowerCase();
    const mob = (r.mobile || '').toLowerCase();
    return full.includes(query) || mob.includes(query);
  });
  results = results.sort((a,b)=>{
    const fa = (a.firstName||a.lastName||'').localeCompare(b.firstName||b.lastName||'');
    if(fa !== 0) return fa;
    return (a.lastName||'').localeCompare(b.lastName||'');
  });

  const meta = document.getElementById('refResultMeta');
  meta.textContent = results.length === REFEREES.length
    ? `${results.length} referees`
    : `${results.length} of ${REFEREES.length} referees`;

  const container = document.getElementById('refResults');
  if(results.length === 0){
    container.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <div>No referees match your search.</div>
      <button class="clear-btn" onclick="clearRefFilters()">Clear filters</button>
    </div>`;
    return;
  }

  container.innerHTML = results.map(r => {
    const mob = formatMobile(r.mobile);
    return `<div class="ref-row">
      <div class="ref-name"><span class="initial-dot">${refInitial(r)}</span>${escapeHtml(refFullName(r))}</div>
      ${mob ? `<button class="call-link" onclick="offerWhatsApp('${escapeHtml(refFullName(r)).replace(/'/g,"\\'")}','${escapeHtml(mob).replace(/'/g,"\\'")}')">${iconPhone} ${escapeHtml(mob)}</button>` : '<span class="no-info">No number on file</span>'}
    </div>`;
  }).join('');
}
function clearRefFilters(){
  document.getElementById('refSearch').value = '';
  letterFilter = null;
  document.querySelectorAll('#letterJump button').forEach(b=>b.classList.remove('active'));
  renderRefs();
}

/* ---------- TABS ---------- */
function showTab(tab){
  document.getElementById('panel-clubs').style.display = tab === 'clubs' ? '' : 'none';
  document.getElementById('panel-refs').style.display = tab === 'refs' ? '' : 'none';
  document.getElementById('tabBtnClubs').classList.toggle('active', tab === 'clubs');
  document.getElementById('tabBtnRefs').classList.toggle('active', tab === 'refs');
  document.getElementById('countPill').textContent = tab === 'clubs'
    ? `${CLUBS.length} clubs`
    : `${REFEREES.length} referees`;
}
document.getElementById('tabBtnClubs').onclick = ()=>showTab('clubs');
document.getElementById('tabBtnRefs').onclick = ()=>showTab('refs');

document.getElementById('clubSearch').addEventListener('input', renderClubs);
document.getElementById('clubSelect').addEventListener('change', renderClubs);
document.getElementById('refSearch').addEventListener('input', renderRefs);

/* ---------- INIT ---------- */
populateClubSelect();
populateRoleChips();
populateLetterJump();
renderClubs();
renderRefs();
showTab('clubs');
</script>
</body>
</html>
